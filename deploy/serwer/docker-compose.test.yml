# Weryfikacja lokalna konfiguracji serwera (docs/WDROZENIE.md, „Weryfikacja lokalna”):
#   docker compose --env-file <plik testowy .env> -f docker-compose.yml -f docker-compose.test.yml up -d
# Atrapa dotychczasowej aplikacji Blazor na porcie 80 komputera (jak kontener flota na serwerze);
# certyfikaty z wewnętrznego urzędu Caddy (CADDY_CERTS=lokalny).

services:
  atrapa-flota:
    image: caddy:2
    command: ["caddy", "respond", "--listen", ":8080", "Atrapa aplikacji Blazor"]
    ports:
      - "80:8080"
