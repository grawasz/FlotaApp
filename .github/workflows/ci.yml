name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_VERSION: 10.0.x

jobs:
  windows:
    name: Testy, Windows, Android
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # .NET for Android: JDK 17 lub 21
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'

      # Obciążenia wymagane przez projekt aplikacji (przywracanie obejmuje wszystkie platformy docelowe)
      - name: Obciążenia .NET
        run: dotnet workload restore src/Flota.App/Flota.App.csproj

      - name: Testy Flota.Core
        run: dotnet test tests/Flota.Core.Tests -c Release

      - name: Testy Flota.Api
        run: dotnet test tests/Flota.Api.Tests -c Release

      - name: Build Windows
        run: dotnet build src/Flota.App -f net10.0-windows10.0.26100 -c Release

      - name: Zależności Android SDK
        run: dotnet build src/Flota.App -f net10.0-android -t:InstallAndroidDependencies -p:AndroidSdkDirectory="$env:ANDROID_SDK_ROOT" -p:AcceptAndroidSDKLicenses=True

      - name: Build Android
        run: dotnet build src/Flota.App -f net10.0-android -c Release -p:AndroidSdkDirectory="$env:ANDROID_SDK_ROOT"

  ios:
    name: iOS
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Obciążenia .NET
        run: dotnet workload restore src/Flota.App/Flota.App.csproj

      # Build dla symulatora — bez podpisu; podpis i pakowanie IPA w zadaniu T8.2
      - name: Build iOS
        run: dotnet build src/Flota.App -f net10.0-ios

  api-image:
    name: Obraz Flota.Api
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Budowanie obrazu
        run: docker build -f src/Flota.Api/Dockerfile -t flota-api:ci .

      # Uruchomienie z bazą SQLite (konfiguracja domyślna) i sprawdzenie /health
      - name: Test uruchomienia
        run: |
          docker run -d --name flota-api -p 8080:8080 flota-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health; then echo; exit 0; fi
            sleep 2
          done
          docker logs flota-api
          exit 1
