name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_VERSION: 10.0.x

jobs:
  windows:
    name: Testy, Windows, Android
    runs-on: windows-latest
    # Build WebAssembly z kompilacją AOT: ok. 15 min
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # .NET for Android: JDK 17 lub 21
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'

      # Obciążenia wymagane przez projekt aplikacji (przywracanie obejmuje wszystkie platformy docelowe)
      # wasm-tools: natywne zasoby WebAssembly (SkiaSharp) — wymagane przez Uno.Wasm.Bootstrap, niezgłaszane przez projekt
      - name: Obciążenia .NET
        run: |
          dotnet workload restore src/Flota.App/Flota.App.csproj
          dotnet workload install wasm-tools

      - name: Testy Flota.Core
        run: dotnet test tests/Flota.Core.Tests -c Release

      - name: Testy Flota.Api
        run: dotnet test tests/Flota.Api.Tests -c Release

      - name: Testy Flota.Presentation
        run: dotnet test tests/Flota.Presentation.Tests -c Release

      - name: Testy statyczne zasobów aplikacji
        run: dotnet test tests/Flota.App.Tests -c Release

      - name: Build Windows
        run: dotnet build src/Flota.App -f net10.0-windows10.0.26100 -c Release

      - name: Build WebAssembly (AOT)
        run: dotnet publish src/Flota.App -f net10.0-browserwasm -c Release -o artifacts/web

      # Aplikacja przeglądarkowa na danych symulatora UniAVL: sekcje (400 i 1400 px) i nazwy dostępne (docs/TESTY-UI.md)
      - name: Testy interfejsu (przeglądarka)
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          $job = Start-Job { & "$using:root/tools/Start-Symulacja.ps1" -WebApp "$using:root/artifacts/web/wwwroot" }
          for ($i = 0; $i -lt 150; $i++) {
            try { if ((Invoke-WebRequest http://localhost:5294/health -UseBasicParsing).StatusCode -eq 200) { break } } catch { }
            Start-Sleep 2
          }
          node tools/TestyUi/testy.mjs http://localhost:5294/ artifacts/ui
          $code = $LASTEXITCODE
          Stop-Job $job
          exit $code

      - name: Zrzuty testów interfejsu
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testy-ui
          path: artifacts/ui
          if-no-files-found: ignore

      - name: Zależności Android SDK
        run: dotnet build src/Flota.App -f net10.0-android -t:InstallAndroidDependencies -p:AndroidSdkDirectory="$env:ANDROID_SDK_ROOT" -p:AcceptAndroidSDKLicenses=True

      - name: Build Android
        run: dotnet build src/Flota.App -f net10.0-android -c Release -p:AndroidSdkDirectory="$env:ANDROID_SDK_ROOT"

  ios:
    name: iOS
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Pasmo SDK 10.0.4xx i zestaw obciążeń 10.0.401: .NET for iOS 26.5 zgodny z Xcode 26 obrazu macos-latest
      # (zestawy nowsze zawierają .NET for iOS 27, wymagający Xcode 27)
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.4xx

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Obciążenia .NET
        run: dotnet workload install ios android --version 10.0.401

      # Build dla symulatora — bez podpisu; podpis i pakowanie IPA w zadaniu T8.2
      - name: Build iOS
        run: dotnet build src/Flota.App -f net10.0-ios

  api-image:
    name: Obraz Flota.Api
    runs-on: ubuntu-latest
    # Etap aplikacji przeglądarkowej z kompilacją AOT: ok. 20 min
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Budowanie obrazu
        run: docker build -f src/Flota.Api/Dockerfile -t flota-api:ci .

      # Uruchomienie z bazą SQLite (konfiguracja domyślna): /health, aplikacja przeglądarkowa pod /, API pod dotychczasowymi ścieżkami
      - name: Test uruchomienia
        run: |
          docker run -d --name flota-api -p 8080:8080 flota-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health; then echo; break; fi
            if [ "$i" = 30 ]; then docker logs flota-api; exit 1; fi
            sleep 2
          done
          curl -fsS http://localhost:8080/ | grep -q '<html' || { echo 'brak aplikacji pod /'; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/fleet/snapshot)
          [ "$code" = 401 ] || { echo "GET /fleet/snapshot bez tokenu: $code (oczekiwano 401)"; exit 1; }
          script=$(curl -fsS http://localhost:8080/ | grep -o 'package_[^"]*/uno-bootstrap\.js' | head -1)
          headers=$(curl -fsS -H 'Accept-Encoding: br' -o /dev/null -D - "http://localhost:8080/$script")
          echo "$headers" | grep -qi '^content-encoding: br' || { echo "brak wariantu Brotli: $script"; exit 1; }
